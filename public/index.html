<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>terefere · giełda walut</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-4M13 17V8M18 17v-7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  </svg>

  <div class="app">
    <header class="top">
      <a class="brand" href="/" aria-label="terefere">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" /><path d="M16 9a7 7 0 1 0 7 7" /><circle cx="16" cy="16" r="2.4" class="fill" /></svg>
        <span>TEREFERE</span>
      </a>
      <div class="search">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Szukaj waluty lub pary" autocomplete="off" aria-label="Szukaj pary walutowej">
        <div class="dropdown" id="searchList" hidden></div>
      </div>
      <div class="mode" role="group" aria-label="Źródło notowań">
        <button data-mode="live" class="on"><i class="pulse"></i>Na żywo</button>
        <button data-mode="sim">Symulacja</button>
        <select id="volatility" aria-label="Zmienność symulacji" hidden>
          <option value="1">Zmienność 1×</option>
          <option value="3">Zmienność 3×</option>
          <option value="10">Zmienność 10×</option>
        </select>
      </div>
      <div class="top-right">
        <div class="bell-wrap">
          <button class="icon-btn" id="bell" aria-label="Powiadomienia"><svg class="ico"><use href="#i-bell"/></svg><i class="dot" hidden></i></button>
          <div class="dropdown right" id="notes" hidden></div>
        </div>
        <div class="pill" title="Wartość portfela"><svg class="ico"><use href="#i-wallet"/></svg><b id="total">—</b></div>
        <label class="pill select">
          <span class="coin sm" id="dispCoin"></span>
          <select id="display" aria-label="Waluta wyceny"><option>PLN</option><option>USD</option><option>EUR</option></select>
          <svg class="ico sm"><use href="#i-chevron"/></svg>
        </label>
        <div class="user">
          <div class="avatar">T</div>
          <div><b>Trader demo</b><small>Konto symulacyjne</small></div>
        </div>
      </div>
    </header>

    <nav class="rail" aria-label="Sekcje">
      <div class="rail-group">
        <a href="#market" class="on" aria-label="Rynek"><svg class="ico"><use href="#i-chart"/></svg></a>
        <a href="#orders" aria-label="Zlecenia"><svg class="ico"><use href="#i-list"/></svg></a>
        <a href="#wallet" aria-label="Portfel"><svg class="ico"><use href="#i-wallet"/></svg></a>
      </div>
      <div class="rail-group">
        <button id="railSim" aria-label="Przełącz symulację rynku" title="Symulacja rynku"><svg class="ico"><use href="#i-zap"/></svg></button>
      </div>
    </nav>

    <main class="main">
      <section class="card ticker" id="market">
        <div class="pair-pick">
          <button id="pairBtn" class="pair-btn" aria-haspopup="listbox">
            <span class="coins" id="pairCoins"></span>
            <b id="pairName">—</b>
            <svg class="ico sm"><use href="#i-chevron"/></svg>
            <span class="price" id="price">—</span>
          </button>
          <div class="sub"><span id="pairLong">—</span><span id="modeTag">Spot</span></div>
          <div class="dropdown" id="pairList" hidden></div>
        </div>
        <dl class="stats">
          <div><dt>Bid</dt><dd id="bid">—</dd></div>
          <div><dt>Ask</dt><dd id="ask">—</dd></div>
          <div><dt>Zmiana 24h</dt><dd id="change">—</dd></div>
          <div><dt>Maks. / Min. 24h</dt><dd id="hilo">—</dd></div>
          <div><dt>Spread / Transakcje 24h</dt><dd id="spread">—</dd></div>
        </dl>
      </section>

      <section class="card chart-card">
        <div class="toolbar">
          <div class="seg" role="tablist">
            <button data-view="chart" class="on">Wykres</button>
            <button data-view="book">Głębokość</button>
          </div>
          <div class="seg green" id="styleSeg">
            <button data-style="candle" class="on">Świece</button>
            <button data-style="line">Linia</button>
          </div>
          <div class="ranges" id="ranges"></div>
        </div>
        <div class="chart-wrap">
          <div id="chart"></div>
          <div id="book" hidden></div>
          <div class="chart-msg" id="chartMsg" hidden></div>
        </div>
      </section>

      <section class="orders" id="orders">
        <div class="orders-head">
          <label class="pill select">
            <select id="orderFilter" aria-label="Filtr zleceń">
              <option value="all">Wszystkie zlecenia</option>
              <option value="open">Oczekujące</option>
              <option value="filled">Zrealizowane</option>
              <option value="cancelled">Anulowane</option>
            </select>
            <svg class="ico sm"><use href="#i-chevron"/></svg>
          </label>
          <label class="check"><input type="checkbox" id="onlyPair"> Tylko bieżąca para</label>
        </div>
        <div id="orderList" class="order-list"></div>
      </section>
    </main>

    <aside class="side">
      <form class="card trade" id="trade" novalidate>
        <div class="seg big sides">
          <button type="button" data-side="buy" class="on">Kup</button>
          <button type="button" data-side="sell">Sprzedaj</button>
        </div>
        <div class="seg types">
          <button type="button" data-type="market" class="on">Rynkowe</button>
          <button type="button" data-type="limit">Limit</button>
          <button type="button" data-type="stop">Stop</button>
        </div>
        <div class="inner">
          <label class="field" id="priceField">
            <span id="priceLabel">Cena</span>
            <div class="input"><input id="priceIn" inputmode="decimal" autocomplete="off"><em id="priceCcy"></em></div>
          </label>
          <label class="field">
            <span>Ilość</span>
            <div class="input"><input id="amountIn" inputmode="decimal" placeholder="0" autocomplete="off"><em id="amountCcy"></em></div>
          </label>
          <div class="avail">Dostępne: <b id="avail">—</b></div>
          <div class="pcts">
            <button type="button" data-pct="25">25%</button><button type="button" data-pct="50">50%</button><button type="button" data-pct="75">75%</button><button type="button" data-pct="100">Max</button>
          </div>
        </div>
        <dl class="summary">
          <div><dt>Kurs</dt><dd id="sumRate">—</dd></div>
          <div><dt>Wartość</dt><dd id="sumValue">—</dd></div>
          <div><dt>Prowizja 0,1%</dt><dd id="sumFee">—</dd></div>
          <div><dt id="sumNetLabel">Zapłacisz</dt><dd id="sumNet">—</dd></div>
        </dl>
        <p class="form-err" id="formErr" role="alert"></p>
        <button class="cta" id="submit" type="submit">Kup</button>
      </form>

      <section class="card wallet" id="wallet">
        <div class="wallet-head">
          <h2>Portfel</h2>
          <button class="link" id="reset" type="button"><svg class="ico sm"><use href="#i-reset"/></svg>Reset</button>
        </div>
        <dl class="summary" id="walletRows"></dl>
        <dl class="summary totals">
          <div><dt>Wartość portfela</dt><dd id="wTotal">—</dd></div>
          <div><dt>Wynik od startu</dt><dd id="wPnl">—</dd></div>
        </dl>
      </section>
    </aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
